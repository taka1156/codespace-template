name: Check Image Updates

on:
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜 00:00 UTC
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for image updates
        run: go run scripts/check_image_updates.go

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update Docker image versions in codespacegen.json'
          title: 'chore: update Docker image versions in codespacegen.json'
          body: |
              A new version of the Docker image defined in `codespacegen.json` has been found.
              Please review the changes and merge them if everything looks good.
          branch: chore/update-images
          delete-branch: true
          labels: dependencies
